name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight image test dependencies
        run: python -m pip install numpy pillow
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Smart Save frontend syntax
        run: |
          node --check web/mr_smart_save.js
          node --check web/mr_smart_save_panel.js
      - name: Compact saver UI regression
        run: node tests/test_compact_saver_panel.cjs
      - name: Smart Save frontend filename prefix regression
        run: node tests/test_smart_save_ui.cjs
      - name: Smart Save widget serialization and label regression
        run: node tests/test_smart_save_widget_migration.cjs
      - name: Python syntax
        run: python -m compileall -q sidecar.py routing.py preview.py mr_lazy_lc.py mr_diagnostics.py mr_pipe_image_replace.py protection_mask.py mr_protection_restore.py save_naming.py polygon_mask.py __init__.py
